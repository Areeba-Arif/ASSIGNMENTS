<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT REGISTRATION FORM</title>
</head>
<body>
    <h1>Student Registration Form</h1>

    <form>

        <!-- Full Name -->
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>

        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <br><br>

        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">

        <br><br>

        <!-- Gender -->
        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <br><br>

        <!-- Favorite Programming Languages -->
        <label>Favorite Programming Languages:</label>

        <br>

        <input type="checkbox" id="html" name="language" value="HTML">
        <label for="html">HTML</label>

        <br>

        <input type="checkbox" id="css" name="language1" value="CSS">
        <label for="css">CSS</label>

        <br>

        <input type="checkbox" id="java" name="language2" value="Java">
        <label for="java">Java</label>

        <br>

        <input type="checkbox" id="javascript" name="language3" value="JavaScript">
        <label for="javascript">JavaScript</label>

        <br>

        <input type="checkbox" id="cpp" name="language4" value="C++">
        <label for="cpp">C++</label>

        <br><br>

        <!-- City -->
        <label for="city">City:</label>

        <select id="city" name="city">
            <option value="">Select your city</option>
            <option value="Karachi">Karachi</option>
            <option value="Lahore">Lahore</option>
            <option value="Islamabad">Islamabad</option>
            <option value="Peshawar">Peshawar</option>
        </select>

        <br><br>

        <!-- About Yourself -->
        <label for="about">About Yourself:</label>

        <br>

        <textarea id="about" name="about" rows="5" cols="40"></textarea>

        <br><br>

        <!-- Buttons -->
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>
</body>
</html>
