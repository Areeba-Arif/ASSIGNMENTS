
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT REGISTRATION FORM</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="registration.css">
</head>

<body>

    <div class="form-container">

        <h1>Student Registration Form</h1>

        <form>

            <!-- Full Name -->
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <!-- Date of Birth -->
            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob">
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label>Gender:</label>

                <div class="gender-options">

                    <label>
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>

                </div>
            </div>

            <!-- Favorite Programming Languages -->
            <div class="form-group">

                <label>Favorite Programming Languages:</label>

                <div class="language-options">

                    <label>
                        <input type="checkbox" name="language" value="HTML">
                        HTML
                    </label>

                    <label>
                        <input type="checkbox" name="language1" value="CSS">
                        CSS
                    </label>

                    <label>
                        <input type="checkbox" name="language2" value="Java">
                        Java
                    </label>

                    <label>
                        <input type="checkbox" name="language3" value="JavaScript">
                        JavaScript
                    </label>

                    <label>
                        <input type="checkbox" name="language4" value="C++">
                        C++
                    </label>

                </div>
            </div>

            <!-- City -->
            <div class="form-group">

                <label for="city">City:</label>

                <select id="city" name="city">
                    <option value="">Select your city</option>
                    <option value="Karachi">Karachi</option>
                    <option value="Lahore">Lahore</option>
                    <option value="Islamabad">Islamabad</option>
                    <option value="Peshawar">Peshawar</option>
                </select>

            </div>

            <!-- About Yourself -->
            <div class="form-group">

                <label for="about">About Yourself:</label>

                <textarea id="about" name="about" rows="5" cols="40"></textarea>

            </div>

            <!-- Buttons -->
            <div class="buttons">

                <input type="submit" value="Submit">
                <input type="reset" value="Reset">

            </div>

        </form>

    </div>

</body>
</html>
